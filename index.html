<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Estimulação Funcional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #FFFFFF 100%);
            min-height: 100vh;
            color: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.5s ease-out;
        }

        header h1 {
            font-size: 32px;
            color: #0B4F6C;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 15px;
            color: #6B7280;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #E5E7EB;
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0B4F6C 0%, #0D7B9C 100%);
            border-radius: 10px;
            transition: width 0.4s ease-out;
        }

        .wizard {
            animation: fadeIn 0.5s ease-out;
        }

        .question {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }

        .question.active {
            display: block;
            opacity: 1;
        }

        .question-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .question-header h2 {
            font-size: 24px;
            color: #0B4F6C;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .question-header p {
            font-size: 15px;
            color: #6B7280;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            padding: 16px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover {
            border-color: #0B4F6C;
            background: #F0F9FC;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: #0B4F6C;
            background: #E8F4F8;
            box-shadow: 0 4px 12px rgba(11, 79, 108, 0.15);
        }

        .option-emoji {
            font-size: 28px;
            line-height: 1;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-text h3 {
            font-size: 15px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 4px;
        }

        .option-text p {
            font-size: 13px;
            color: #6B7280;
        }

        .result-container {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .result-container.active {
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .result-header h2 {
            font-size: 28px;
            color: #0B4F6C;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .meta-box {
            background: linear-gradient(135deg, #0B4F6C 0%, #0D7B9C 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 32px;
            box-shadow: 0 10px 30px rgba(11, 79, 108, 0.2);
        }

        .meta-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .meta-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
        }

        .plan-box {
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .plan-box h3 {
            font-size: 16px;
            color: #0B4F6C;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .plan-box ul {
            list-style: none;
        }

        .plan-box li {
            padding: 10px 0;
            padding-left: 24px;
            position: relative;
            font-size: 14px;
            color: #1F2937;
            line-height: 1.6;
        }

        .plan-box li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #0B4F6C;
            font-weight: 600;
        }

        .copy-box {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            position: relative;
        }

        .copy-box textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 11px;
            color: #1F2937;
            resize: none;
            outline: none;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }

        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #0B4F6C;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #0D7B9C;
            transform: scale(1.05);
        }

        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10B981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            animation: slideInRight 0.3s ease-out forwards;
            z-index: 1000;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-secondary {
            background: #E8F4F8;
            color: #0B4F6C;
            border: 2px solid #0B4F6C;
        }

        .btn-secondary:hover {
            background: #D0E8F0;
            transform: translateY(-2px);
        }

        .step-counter {
            text-align: center;
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 26px;
            }

            .meta-box {
                padding: 30px 20px;
            }

            .meta-value {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Guia de Estimulação Funcional</h1>
            <p>Calculadora clínica de fisioterapia</p>
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="step-counter" id="stepCounter"></div>

        <div class="wizard" id="wizard"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-header">
                <h2>✅ Avaliação Concluída</h2>
            </div>

            <div class="meta-box">
                <div class="meta-label">Meta Funcional</div>
                <div class="meta-value" id="metaFuncional"></div>
            </div>

            <div class="plan-box">
                <h3>💡 Plano Terapêutico Sugerido</h3>
                <ul id="planList"></ul>
            </div>

            <div class="copy-box">
                <textarea id="textareaResult" readonly></textarea>
                <button class="copy-btn" onclick="copyToClipboard()">Copiar</button>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="resetWizard()">↻ Nova Avaliação</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: "elegibilidade",
                titulo: "Elegibilidade do Paciente",
                descricao: "Avalie se o paciente atende aos critérios de elegibilidade",
                options: [
                    { id: "elegivel", emoji: "✅", titulo: "Elegível", desc: "Paciente elegível" },
                    { id: "elegivel_barreiras", emoji: "⚠️", titulo: "Elegível com barreiras", desc: "Atende critérios, mas apresenta barreiras" },
                    { id: "nao_elegivel", emoji: "❌", titulo: "Não elegível", desc: "Não atende aos critérios" }
                ],
                showFn: () => true
            },
            {
                id: "estabilidade",
                titulo: "Estabilidade Clínica",
                descricao: "Avalie a estabilidade clínica do paciente",
                options: [
                    { id: "estavel", emoji: "💪", titulo: "Estável", desc: "Clinicamente estável" },
                    { id: "instavel", emoji: "⚠️", titulo: "Instável", desc: "Clinicamente instável" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel"
            },
            {
                id: "neurologica",
                titulo: "Avaliação Neurológica",
                descricao: "Avalie o estado neurológico do paciente",
                options: [
                    { id: "orientado", emoji: "🧠", titulo: "Orientado", desc: "Orientado em tempo e espaço" },
                    { id: "vigil_desorientado", emoji: "😴", titulo: "Vigil, mas desorientado", desc: "Acorda facilmente, mas desorientado" },
                    { id: "irresponsivo", emoji: "🚨", titulo: "Irresponsivo", desc: "Sem resposta ou sem abertura ocular" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel"
            },
            {
                id: "nivel_funcional",
                titulo: "Nível Funcional Atual",
                descricao: "Indique o maior nível funcional que o paciente consegue realizar",
                options: [
                    { id: "restrito_leito", emoji: "🛏️", titulo: "Restrito ao leito", desc: "Não sai do leito" },
                    { id: "troca_decubitos", emoji: "↔️", titulo: "Troca de decúbito", desc: "Realiza mudanças de posição" },
                    { id: "sedestacao", emoji: "🪑", titulo: "Assume sedestação", desc: "Consegue ficar sentado" },
                    { id: "bipedestacao", emoji: "🧑", titulo: "Assume bipedestação", desc: "Consegue ficar em pé" },
                    { id: "deambula", emoji: "🚶", titulo: "Deambula", desc: "Consegue caminhar" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel" && answers.neurologica && answers.neurologica !== "irresponsivo"
            },
            {
                id: "ativacao_postural",
                titulo: "Ativação Postural",
                descricao: "Avalie a capacidade de ativação postural do paciente",
                options: [],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel" && answers.neurologica && answers.neurologica !== "irresponsivo" && answers.nivel_funcional
            }
        ];

        const labels = {
            elegivel: "Elegível",
            elegivel_barreiras: "Elegível com barreiras",
            nao_elegivel: "Não elegível",
            estavel: "Estável",
            instavel: "Instável",
            orientado: "Orientado",
            vigil_desorientado: "Vigil, desorientado",
            irresponsivo: "Irresponsivo",
            restrito_leito: "Restrito ao leito",
            troca_decubitos: "Troca decúbito",
            sedestacao: "Sedestação",
            bipedestacao: "Bipedestação",
            deambula: "Deambula",
            nao_demonstra: "Não demonstra",
            demonstra_falhas: "Com falhas",
            ativa_adequadamente: "Ativa adequadamente"
        };

        let answers = {};
        let currentStep = 0;

        function getAtivacaoOptions() {
            const nivelFuncional = answers.nivel_funcional;
            if (nivelFuncional === "restrito_leito") {
                return [
                    { id: "nao_demonstra", emoji: "❌", titulo: "Não demonstra", desc: "Sem ativação postural" },
                    { id: "demonstra_falhas", emoji: "⚠️", titulo: "Com falhas", desc: "Demonstra alguma ativação, com falhas" },
                    { id: "ativa_adequadamente", emoji: "✅", titulo: "Ativa adequadamente", desc: "Ativação postural adequada" }
                ];
            }
            return [
                { id: "demonstra_falhas", emoji: "⚠️", titulo: "Com falhas", desc: "Demonstra alguma ativação, com falhas" },
                { id: "ativa_adequadamente", emoji: "✅", titulo: "Ativa adequadamente", desc: "Ativação postural adequada" }
            ];
        }

        function getVisibleSteps() {
            return questions.filter(q => q.showFn(answers));
        }

        function shouldStop() {
            if (answers.elegibilidade === "nao_elegivel") return true;
            if (answers.estabilidade === "instavel") return true;
            if (answers.neurologica === "irresponsivo") return true;
            return false;
        }

        function renderStep() {
            const visibleSteps = getVisibleSteps();
            const totalSteps = visibleSteps.length;

            updateProgress(currentStep + 1, totalSteps);

            if (shouldStop()) {
                showResult();
                return;
            }

            if (currentStep >= visibleSteps.length) {
                showResult();
                return;
            }

            const step = visibleSteps[currentStep];
            let options = step.options;
            if (step.id === "ativacao_postural") {
                options = getAtivacaoOptions();
            }

            const wizardHTML = `
                <div class="question active">
                    <div class="question-header">
                        <h2>${step.titulo}</h2>
                        <p>${step.descricao}</p>
                    </div>
                    <div class="options-grid">
                        ${options.map(opt => `
                            <button class="option-btn ${answers[step.id] === opt.id ? 'selected' : ''}" onclick="selectOption('${step.id}', '${opt.id}')">
                                <div class="option-emoji">${opt.emoji}</div>
                                <div class="option-text">
                                    <h3>${opt.titulo}</h3>
                                    <p>${opt.desc}</p>
                                </div>
                            </button>
                        `).join("")}
                    </div>
                </div>
            `;

            document.getElementById("wizard").innerHTML = wizardHTML;
        }

        function selectOption(questionId, optionId) {
            answers[questionId] = optionId;
            currentStep++;
            renderStep();
        }

        function updateProgress(current, total) {
            const percent = (current / total) * 100;
            document.getElementById("progressFill").style.width = percent + "%";
            document.getElementById("stepCounter").textContent = `Questão ${current} de ${total}`;
        }

        function calculateMetaFuncional() {
            const p4 = answers.nivel_funcional;
            const p5 = answers.ativacao_postural;

            const metaMap = {
                "restrito_leito|nao_demonstra": "Troca de decúbito com auxílio",
                "restrito_leito|demonstra_falhas": "Independência no leito",
                "restrito_leito|ativa_adequadamente": "Troca de decúbito independente",
                "troca_decubitos|demonstra_falhas": "Sedestação com auxílio",
                "troca_decubitos|ativa_adequadamente": "Sedestação independente",
                "sedestacao|demonstra_falhas": "Bipedestação com auxílio",
                "sedestacao|ativa_adequadamente": "Bipedestação independente",
                "bipedestacao|demonstra_falhas": "Deambulação com auxílio",
                "bipedestacao|ativa_adequadamente": "Deambulação independente",
                "deambula|demonstra_falhas": "Deambulação funcional independente",
                "deambula|ativa_adequadamente": "Deambulação funcional independente"
            };

            return metaMap[`${p4}|${p5}`] || "-";
        }

        function calculatePlan() {
            const p1 = answers.elegibilidade;
            const p2 = answers.estabilidade;
            const p3 = answers.neurologica;
            const p4 = answers.nivel_funcional;
            const p5 = answers.ativacao_postural;

            if (p1 === "nao_elegivel") {
                return ["Reavaliar elegibilidade assim que possível"];
            }

            if (p2 === "instavel") {
                if (p1 === "elegivel") {
                    return ["Posicionar adequadamente o paciente", "Estimulação sensorial"];
                } else {
                    return ["Estimulação sensorial", "Mobilização passiva em padrão funcional", "Estímulos de carga em MMII", "Posicionar adequadamente"];
                }
            }

            if (p3 === "irresponsivo") {
                return ["Estimulação sensorial", "Mobilização passiva em padrão funcional", "Estímulos de carga em MMII", "Posicionar adequadamente"];
            }

            if (p4 === "restrito_leito" && p5 === "nao_demonstra") {
                return [
                    "Estimulação sensorial",
                    "Estabilização central e de cinturas",
                    "Ação antigravitária no leito",
                    "Mobilização ativo-assistida com padrões funcionais",
                    "Posicionamento adequado"
                ];
            }

            if (p4 === "restrito_leito" && p5 === "demonstra_falhas") {
                return [
                    "Refino de estabilização",
                    "Ação antigravitária no leito",
                    "Padrões de alcance e apoio para mudanças de decúbito",
                    "Evolução para posturas mais altas se possível"
                ];
            }

            if (p4 === "restrito_leito" && p5 === "ativa_adequadamente") {
                if (p3 === "orientado") {
                    return [
                        "Refino de estabilização",
                        "Ação antigravitária no leito",
                        "Padrões de alcance e apoio para mudanças de decúbito",
                        "Evolução para posturas mais altas se possível"
                    ];
                } else {
                    return [
                        "Estimulação em posturas baixas",
                        "Evolução para treino de estabilização na sedestação",
                        "Treino de alcances e descarga de peso nos MMII"
                    ];
                }
            }

            if (p4 === "troca_decubitos" && p5 === "demonstra_falhas") {
                return [
                    "Refino de estabilização",
                    "Ação antigravitária no leito",
                    "Padrões de alcance para mudanças de decúbito",
                    "Evolução para posturas mais altas se possível"
                ];
            }

            if (p4 === "troca_decubitos" && p5 === "ativa_adequadamente") {
                return [
                    "Estimulação em posturas baixas",
                    "Evolução para treino de estabilização na sedestação",
                    "Treino de alcances e descarga de peso nos MMII"
                ];
            }

            if (p4 === "sedestacao" && p5 === "demonstra_falhas") {
                return [
                    "Estimulação em posturas baixas",
                    "Treino de estabilização na sedestação",
                    "Treino de alcances",
                    "Treino de descarga de peso nos MMII"
                ];
            }

            if (p4 === "sedestacao" && p5 === "ativa_adequadamente") {
                return [
                    "Treino de alcances",
                    "Treino de descarga de peso nos MMII",
                    "Evolução para bipedestação"
                ];
            }

            if (p4 === "bipedestacao" && p5 === "demonstra_falhas") {
                return [
                    "Estimulação em posturas mais baixas",
                    "Treino de ação antigravitária",
                    "Recrutamento de sinergias posturais",
                    "Treino de alcances",
                    "Evolução para unipodal se possível"
                ];
            }

            if (p4 === "bipedestacao" && p5 === "ativa_adequadamente") {
                return [
                    "Treino unipodal",
                    "Treino de marcha",
                    "Agachamento (sentar/levantar)",
                    "Treino de escadas"
                ];
            }

            if (p4 === "deambula" && p5 === "demonstra_falhas") {
                return [
                    "Treino de marcha",
                    "Agachamento (sentar/levantar)",
                    "Treino de escadas",
                    "Funcionalidade específica do paciente"
                ];
            }

            if (p4 === "deambula" && p5 === "ativa_adequadamente") {
                if (p3 === "orientado") {
                    return [
                        "Treino unipodal",
                        "Treino de marcha",
                        "Agachamento (sentar/levantar)",
                        "Treino de escadas"
                    ];
                } else {
                    return [
                        "Treino de marcha",
                        "Agachamento (sentar/levantar)",
                        "Treino de escadas",
                        "Funcionalidade específica do paciente"
                    ];
                }
            }

            return [];
        }

        function showResult() {
            document.getElementById("wizard").style.display = "none";
            document.getElementById("stepCounter").style.display = "none";
            document.getElementById("resultContainer").classList.add("active");

            const metaFuncional = calculateMetaFuncional();
            const plan = calculatePlan();

            document.getElementById("metaFuncional").textContent = metaFuncional;
            document.getElementById("planList").innerHTML = plan.map(item => `<li>${item}</li>`).join("");

            generateProntuarioText(metaFuncional, plan);

            updateProgress(getVisibleSteps().length, getVisibleSteps().length);
        }

        function generateProntuarioText(metaFuncional, plan) {
            const text = `Avaliação Clínica - Guia de Estimulação Funcional

Elegibilidade: ${labels[answers.elegibilidade]}
Estabilidade: ${labels[answers.estabilidade] || "—"}
Neurológica: ${labels[answers.neurologica] || "—"}
Nível funcional: ${labels[answers.nivel_funcional] || "—"}
Ativação postural: ${labels[answers.ativacao_postural] || "—"}

Meta funcional: ${metaFuncional}

Sugestões:
${plan.map(item => `• ${item}`).join("\n")}`;

            document.getElementById("textareaResult").value = text;
        }

        function copyToClipboard() {
            const textarea = document.getElementById("textareaResult");
            textarea.select();
            document.execCommand("copy");

            const feedback = document.createElement("div");
            feedback.className = "copy-feedback";
            feedback.textContent = "✓ Copiado com sucesso!";
            document.body.appendChild(feedback);

            setTimeout(() => feedback.remove(), 2000);
        }

        function resetWizard() {
            answers = {};
            currentStep = 0;
            document.getElementById("wizard").style.display = "block";
            document.getElementById("stepCounter").style.display = "block";
            document.getElementById("resultContainer").classList.remove("active");
            renderStep();
        }

        document.addEventListener("DOMContentLoaded", renderStep);
    </script>
</body>
</html>
