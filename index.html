<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Raciocínio Clínico</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #FFFFFF 100%);
            min-height: 100vh;
            color: #1F2937;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.5s ease-out;
        }

        header h1 {
            font-size: 32px;
            color: #0B4F6C;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 15px;
            color: #6B7280;
            font-weight: 500;
        }

        .form-container {
            animation: fadeIn 0.4s ease-out;
        }

        .question-block {
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
            animation: slideDown 0.4s ease-out;
        }

        .question-block.answered {
            background: #F9FAFB;
            border-color: #0B4F6C;
        }

        .question-block h3 {
            font-size: 18px;
            color: #0B4F6C;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .question-block p {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 20px;
        }

        .question-block.hidden {
            display: none;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 14px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover {
            border-color: #0B4F6C;
            background: #F0F9FC;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: #0B4F6C;
            background: #E8F4F8;
            box-shadow: 0 4px 12px rgba(11, 79, 108, 0.15);
        }

        .option-emoji {
            font-size: 24px;
            line-height: 1;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-text h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 2px;
        }

        .option-text p {
            font-size: 12px;
            color: #6B7280;
            margin: 0;
        }

        .result-box {
            background: linear-gradient(135deg, #0B4F6C 0%, #0D7B9C 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 16px;
            margin-top: 40px;
            box-shadow: 0 15px 40px rgba(11, 79, 108, 0.25);
            animation: slideDown 0.5s ease-out;
        }

        .result-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .plan-section {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .plan-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .plan-list {
            list-style: none;
        }

        .plan-list li {
            padding: 6px 0;
            font-size: 13px;
            line-height: 1.5;
            position: relative;
            padding-left: 16px;
        }

        .plan-list li:before {
            content: "→";
            position: absolute;
            left: 0;
        }

        .copy-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .copy-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .copy-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .copy-box textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: white;
            resize: none;
            outline: none;
            line-height: 1.6;
            height: 350px;
            max-height: 350px;
            overflow-y: auto;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 12px;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10B981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            animation: slideInRight 0.3s ease-out forwards;
            z-index: 1000;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 26px;
            }

            .question-block {
                padding: 20px;
            }

            .result-box {
                padding: 30px 20px;
            }

            .result-value {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Guia de Raciocínio Clínico</h1>
            <p>Divisão de Fisioterapia ICHC</p>
        </header>

        <div class="form-container" id="formContainer"></div>
        <div id="resultContainer"></div>
    </div>

    <script>
        const questions = [
            {
                id: "elegibilidade",
                titulo: "O paciente é elegível para a avaliação?",
                descricao: "",
                options: [
                    { id: "elegivel", emoji: "🟢", titulo: "Paciente elegível", desc: "Baixo risco, poucas barreiras" },
                    { id: "elegivel_barreiras", emoji: "🟡", titulo: "Elegível com barreiras", desc: "Benefícios presentes, mas riscos elevados" },
                    { id: "nao_elegivel", emoji: "🔴", titulo: "Não elegível", desc: "Riscos superam os benefícios" }
                ],
                showFn: () => true
            },
            {
                id: "estabilidade",
                titulo: "Como está a estabilidade clínica do paciente?",
                descricao: "",
                options: [
                    { id: "estavel", emoji: "🟢", titulo: "Estável", desc: "Sem alterações vitais, clínica controlada" },
                    { id: "instavel", emoji: "🔴", titulo: "Instável", desc: "Alterações vitais, variabilidade clínica importante" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel"
            },
            {
                id: "neurologica",
                titulo: "Como está a avaliação neurológica do paciente?",
                descricao: "",
                options: [
                    { id: "orientado", emoji: "🟢", titulo: "Orientado", desc: "Glasgow 15, compreende comandos" },
                    { id: "vigil_desorientado", emoji: "🟡", titulo: "Vigil, mas desorientado", desc: "Colaborativo parcialmente — Glasgow 12–14" },
                    { id: "irresponsivo", emoji: "🔴", titulo: "Irresponsivo", desc: "Coma; sedação profunda — Glasgow < 8" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel"
            },
            {
                id: "nivel_funcional",
                titulo: "Qual é o nível de mobilidade funcional atual do paciente?",
                descricao: "",
                options: [
                    { id: "restrito_leito", emoji: "🛏️", titulo: "Restrito ao leito", desc: "Não realiza trocas posturais independentemente" },
                    { id: "troca_decubitos", emoji: "↔️", titulo: "Troca decúbitos no leito", desc: "Realiza trocas posturais de forma independente" },
                    { id: "sedestacao", emoji: "🪑", titulo: "Assume Sedestação", desc: "Senta na beira do leito, com ou sem auxílio" },
                    { id: "bipedestacao", emoji: "🧍", titulo: "Assume Bipedestação", desc: "Fica em pé, com ou sem auxílio" },
                    { id: "deambula", emoji: "🚶", titulo: "Deambula", desc: "Caminha, com ou sem auxílio" }
                ],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel" && answers.neurologica && answers.neurologica !== "irresponsivo"
            },
            {
                id: "ativacao_postural",
                titulo: "Como é a ativação dos músculos posturais?",
                descricao: "",
                options: [],
                showFn: (answers) => answers.elegibilidade && answers.elegibilidade !== "nao_elegivel" && answers.estabilidade === "estavel" && answers.neurologica && answers.neurologica !== "irresponsivo" && answers.nivel_funcional
            }
        ];

        const labels = {
            elegivel: "Elegível",
            elegivel_barreiras: "Elegível com barreiras",
            nao_elegivel: "Não elegível",
            estavel: "Estável",
            instavel: "Instável",
            orientado: "Orientado",
            vigil_desorientado: "Vigil, desorientado",
            irresponsivo: "Irresponsivo",
            restrito_leito: "Restrito ao leito",
            troca_decubitos: "Troca decúbito",
            sedestacao: "Sedestação",
            bipedestacao: "Bipedestação",
            deambula: "Deambula",
            nao_demonstra: "Não demonstra",
            demonstra_falhas: "Com falhas",
            ativa_adequadamente: "Ativa adequadamente"
        };

        let answers = {};

        function getAtivacaoOptions() {
            const nivelFuncional = answers.nivel_funcional;
            if (nivelFuncional === "restrito_leito") {
                return [
                    { id: "nao_demonstra", emoji: "🔴", titulo: "Não demonstra", desc: "Sem resposta postural aos estímulos" },
                    { id: "demonstra_falhas", emoji: "🟡", titulo: "Com falhas", desc: "Ativação presente mas com alterações de tônus/padrão" },
                    { id: "ativa_adequadamente", emoji: "🟢", titulo: "Ativa adequadamente", desc: "Resposta postural adequada aos estímulos" }
                ];
            }
            return [
                { id: "demonstra_falhas", emoji: "🟡", titulo: "Com falhas", desc: "Ativação presente mas com deficiência de controle/sinergia" },
                { id: "ativa_adequadamente", emoji: "🟢", titulo: "Ativa adequadamente", desc: "Controle postural adequado para o nível funcional" }
            ];
        }

        function getVisibleSteps() {
            return questions.filter(q => q.showFn(answers));
        }

        function shouldStop() {
            if (answers.elegibilidade === "nao_elegivel") return true;
            if (answers.estabilidade === "instavel") return true;
            if (answers.neurologica === "irresponsivo") return true;
            return false;
        }

        function renderQuestions() {
            const visibleSteps = getVisibleSteps();
            let html = '';

            for (let i = 0; i < visibleSteps.length; i++) {
                const step = visibleSteps[i];
                const isAnswered = !!answers[step.id];
                let options = step.options;

                if (step.id === "ativacao_postural") {
                    options = getAtivacaoOptions();
                }

                html += `
                    <div class="question-block ${isAnswered ? 'answered' : ''}" id="block-${step.id}">
                        <h3>${step.titulo}</h3>
                        <p>${step.descricao}</p>
                        <div class="options-grid">
                            ${options.map(opt => `
                                <button class="option-btn ${answers[step.id] === opt.id ? 'selected' : ''}" onclick="selectOption('${step.id}', '${opt.id}')">
                                    <div class="option-emoji">${opt.emoji}</div>
                                    <div class="option-text">
                                        <h4>${opt.titulo}</h4>
                                        <p>${opt.desc}</p>
                                    </div>
                                </button>
                            `).join("")}
                        </div>
                    </div>
                `;

                // Se deve parar aqui, não mostra mais perguntas
                if (isAnswered && shouldStop()) break;
            }

            document.getElementById("formContainer").innerHTML = html;

            // Mostrar resultado se necessário
            if (shouldStop() || (visibleSteps.length > 0 && answers[visibleSteps[visibleSteps.length - 1].id])) {
                showResult();
            }
        }

        function selectOption(questionId, optionId) {
            answers[questionId] = optionId;
            renderQuestions();

            // Scroll para a próxima pergunta
            setTimeout(() => {
                const nextBlock = document.querySelector('.question-block.hidden, .result-box');
                if (nextBlock) {
                    nextBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
        }

        function calculateMetaFuncional() {
            const p4 = answers.nivel_funcional;
            const p5 = answers.ativacao_postural;

            const metaMap = {
                "restrito_leito|nao_demonstra": "Troca de decúbito com auxílio",
                "restrito_leito|demonstra_falhas": "Independência no leito",
                "restrito_leito|ativa_adequadamente": "Troca de decúbito independente",
                "troca_decubitos|demonstra_falhas": "Sedestação com auxílio",
                "troca_decubitos|ativa_adequadamente": "Sedestação independente",
                "sedestacao|demonstra_falhas": "Bipedestação com auxílio",
                "sedestacao|ativa_adequadamente": "Bipedestação independente",
                "bipedestacao|demonstra_falhas": "Deambulação com auxílio",
                "bipedestacao|ativa_adequadamente": "Deambulação independente",
                "deambula|demonstra_falhas": "Deambulação funcional independente",
                "deambula|ativa_adequadamente": "Deambulação funcional independente"
            };

            return metaMap[`${p4}|${p5}`] || "-";
        }

        function calculatePlan() {
            const p1 = answers.elegibilidade;
            const p2 = answers.estabilidade;
            const p3 = answers.neurologica;
            const p4 = answers.nivel_funcional;
            const p5 = answers.ativacao_postural;

            if (p1 === "nao_elegivel") {
                return ["Reavaliar elegibilidade assim que possível"];
            }

            if (p2 === "instavel") {
                if (p1 === "elegivel") {
                    return ["Posicionar adequadamente o paciente", "Estimulação sensorial"];
                } else {
                    return ["Estimulação sensorial", "Mobilização passiva em padrão funcional", "Estímulos de carga em MMII", "Posicionar adequadamente"];
                }
            }

            if (p3 === "irresponsivo") {
                return ["Estimulação sensorial", "Mobilização passiva em padrão funcional", "Estímulos de carga em MMII", "Posicionar adequadamente"];
            }

            if (p4 === "restrito_leito" && p5 === "nao_demonstra") {
                return [
                    "Estimulação sensorial",
                    "Estabilização central e de cinturas",
                    "Ação antigravitária no leito",
                    "Mobilização ativo-assistida com padrões funcionais",
                    "Posicionamento adequado"
                ];
            }

            if (p4 === "restrito_leito" && p5 === "demonstra_falhas") {
                return [
                    "Refino de estabilização",
                    "Ação antigravitária no leito",
                    "Padrões de alcance e apoio para mudanças de decúbito",
                    "Evolução para posturas mais altas se possível"
                ];
            }

            if (p4 === "restrito_leito" && p5 === "ativa_adequadamente") {
                if (p3 === "orientado") {
                    return [
                        "Refino de estabilização",
                        "Ação antigravitária no leito",
                        "Padrões de alcance e apoio para mudanças de decúbito",
                        "Evolução para posturas mais altas se possível"
                    ];
                } else {
                    return [
                        "Estimulação em posturas baixas",
                        "Evolução para treino de estabilização na sedestação",
                        "Treino de alcances e descarga de peso nos MMII"
                    ];
                }
            }

            if (p4 === "troca_decubitos" && p5 === "demonstra_falhas") {
                return [
                    "Refino de estabilização",
                    "Ação antigravitária no leito",
                    "Padrões de alcance para mudanças de decúbito",
                    "Evolução para posturas mais altas se possível"
                ];
            }

            if (p4 === "troca_decubitos" && p5 === "ativa_adequadamente") {
                return [
                    "Estimulação em posturas baixas",
                    "Evolução para treino de estabilização na sedestação",
                    "Treino de alcances e descarga de peso nos MMII"
                ];
            }

            if (p4 === "sedestacao" && p5 === "demonstra_falhas") {
                return [
                    "Estimulação em posturas baixas",
                    "Treino de estabilização na sedestação",
                    "Treino de alcances",
                    "Treino de descarga de peso nos MMII"
                ];
            }

            if (p4 === "sedestacao" && p5 === "ativa_adequadamente") {
                return [
                    "Treino de alcances",
                    "Treino de descarga de peso nos MMII",
                    "Evolução para bipedestação"
                ];
            }

            if (p4 === "bipedestacao" && p5 === "demonstra_falhas") {
                return [
                    "Estimulação em posturas mais baixas",
                    "Treino de ação antigravitária",
                    "Recrutamento de sinergias posturais",
                    "Treino de alcances",
                    "Evolução para unipodal se possível"
                ];
            }

            if (p4 === "bipedestacao" && p5 === "ativa_adequadamente") {
                return [
                    "Treino unipodal",
                    "Treino de marcha",
                    "Agachamento (sentar/levantar)",
                    "Treino de escadas"
                ];
            }

            if (p4 === "deambula" && p5 === "demonstra_falhas") {
                return [
                    "Treino de marcha",
                    "Agachamento (sentar/levantar)",
                    "Treino de escadas",
                    "Funcionalidade específica do paciente"
                ];
            }

            if (p4 === "deambula" && p5 === "ativa_adequadamente") {
                if (p3 === "orientado") {
                    return [
                        "Treino unipodal",
                        "Treino de marcha",
                        "Agachamento (sentar/levantar)",
                        "Treino de escadas"
                    ];
                } else {
                    return [
                        "Treino de marcha",
                        "Agachamento (sentar/levantar)",
                        "Treino de escadas",
                        "Funcionalidade específica do paciente"
                    ];
                }
            }

            return [];
        }

        function showResult() {
            const metaFuncional = calculateMetaFuncional();
            const plan = calculatePlan();

            const resultHTML = `
                <div class="result-box">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div class="result-label">META FUNCIONAL</div>
                        <div class="result-value">${metaFuncional}</div>
                    </div>

                    <div class="plan-section">
                        <div class="plan-title">PLANO TERAPÊUTICO SUGERIDO</div>
                        <ul class="plan-list">
                            ${plan.map(item => `<li>${item}</li>`).join("")}
                        </ul>
                    </div>

                    <div class="copy-section">
                        <div class="copy-title">DOCUMENTO CLÍNICO</div>
                        <div class="copy-box">
                            <textarea id="textareaResult" readonly>${generateProntuarioText(metaFuncional, plan)}</textarea>
                        </div>
                        <button class="copy-btn" onclick="copyToClipboard()">Copiar</button>
                    </div>

                    <button class="reset-btn" onclick="resetForm()">Nova Avaliação</button>
                </div>
            `;

            document.getElementById("resultContainer").innerHTML = resultHTML;
        }

        function generateProntuarioText(metaFuncional, plan) {
            return `Avaliação Clínica - Guia de Estimulação Funcional

Elegibilidade: ${labels[answers.elegibilidade]}
Estabilidade: ${labels[answers.estabilidade] || "—"}
Neurológica: ${labels[answers.neurologica] || "—"}
Nível funcional: ${labels[answers.nivel_funcional] || "—"}
Ativação postural: ${labels[answers.ativacao_postural] || "—"}

Meta funcional: ${metaFuncional}

Sugestões:
${plan.map(item => `• ${item}`).join("\n")}`;
        }

        function copyToClipboard() {
            const textarea = document.getElementById("textareaResult");
            textarea.select();
            document.execCommand("copy");

            const feedback = document.createElement("div");
            feedback.className = "copy-feedback";
            feedback.textContent = "✓ Copiado com sucesso!";
            document.body.appendChild(feedback);

            setTimeout(() => feedback.remove(), 2000);
        }

        function resetForm() {
            answers = {};
            document.getElementById("resultContainer").innerHTML = '';
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderQuestions();
    </script>
</body>
</html>
